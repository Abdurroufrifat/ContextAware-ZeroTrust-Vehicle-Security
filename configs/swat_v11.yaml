# V11 second dataset protocol. Use only SWaT files obtained under the official terms.
dataset:
  name: SWaT
  version: "SWaT 2015, record the exact official release here before freezing"
  source_url: "https://www.sutd.edu.sg/itrust/itrust-labs/datasets/dataset-characteristics/swat/"
  train_csvs:
    - data/raw/swat/normal/*.csv
  test_csvs:
    - data/raw/swat/attack/*.csv
  output_directory: data/processed/swat_v11
  label_column: Normal/Attack
  normal_values: ["Normal", "normal", 0, "0"]
  root_column: null
  features: null
  window_size: 64
  stride: 4
  label_rule: any
  validation_fraction: 0.20

# No physical topology is claimed for this cross dataset validation. The model uses
# the project's documented fully connected statistical graph fallback.
topology: {}

model:
  detection_mode: normal_only
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.15
  score_top_k: 5

training:
  seed: 7
  epochs: 30
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  physics_weight: 0.0
  reconstruction_weight: 0.05
  root_weight: 0.0
  mask_probability: 0.15
  calibration_quantile: 0.995
  node_scale_quantile: 0.99
  lower_reference_probability: 0.05

physics_invariants: []

process_grounding:
  require: false
  invariant_threshold: 0.05
  counterfactual_minimum: 0.0

artifacts:
  directory: artifacts/swat_v11/seeds

evaluation:
  protocol: "normal only train and calibration, one untouched attack test evaluation"
  seeds: [7, 17, 29, 43, 61]
  baseline_seed: 7

