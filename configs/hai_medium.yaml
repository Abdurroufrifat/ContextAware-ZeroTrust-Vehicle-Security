# CPU development configuration. Metrics are not publication evidence.
dataset:
  name: HAI-23.05-medium-development
  train_csvs:
    - data/staged/hai-23.05/hai-train*.csv
  test_csvs:
    - data/staged/hai-23.05/hai-test*.csv
  output_directory: data/processed/hai_medium
  label_column: attack
  normal_values: [0, "0", "normal", "Normal"]
  root_column: null
  features: null
  window_size: 64
  stride: 64
  label_rule: any
  validation_fraction: 0.20

# Development baseline only. Publication runs require authenticated
# physical/control edges derived from the HAI topology and technical manual.
topology: {}

model:
  detection_mode: normal_only
  d_model: 32
  n_heads: 4
  n_layers: 1
  dropout: 0.15

training:
  seed: 7
  epochs: 5
  batch_size: 8
  learning_rate: 0.0002
  weight_decay: 0.0001
  physics_weight: 0.05
  reconstruction_weight: 0.05
  root_weight: 0.25
  mask_probability: 0.15
  calibration_quantile: 0.995

physics_invariants: []

process_grounding:
  require: false
  invariant_threshold: 0.05
  counterfactual_minimum: 0.0

artifacts:
  directory: artifacts/hai_medium
