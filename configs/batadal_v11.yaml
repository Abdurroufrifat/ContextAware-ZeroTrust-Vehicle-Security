# V11 independent CPS detector validation on the official BATADAL benchmark.
dataset:
  name: BATADAL
  version: "Official BATADAL development datasets released 20 and 28 November 2016"
  source_url: "https://www.batadal.net/data.html"
  train_csvs:
    - data/raw/batadal/BATADAL_dataset03.csv
  test_csvs:
    - data/raw/batadal/BATADAL_dataset04.csv
  output_directory: data/processed/batadal_v11
  label_column: ATT_FLAG
  # Dataset 3 encodes normal as 0. Dataset 4 uses -999 for normal and 1 for
  # approximately labeled attack intervals.
  normal_values: [0, "0", 0.0, "0.0", -999, "-999", -999.0, "-999.0"]
  root_column: null
  features:
    - L_T1
    - L_T2
    - L_T3
    - L_T4
    - L_T5
    - L_T6
    - L_T7
    - F_PU1
    - S_PU1
    - F_PU2
    - S_PU2
    - F_PU3
    - S_PU3
    - F_PU4
    - S_PU4
    - F_PU5
    - S_PU5
    - F_PU6
    - S_PU6
    - F_PU7
    - S_PU7
    - F_PU8
    - S_PU8
    - F_PU9
    - S_PU9
    - F_PU10
    - S_PU10
    - F_PU11
    - S_PU11
    - F_V2
    - S_V2
    - P_J280
    - P_J269
    - P_J300
    - P_J256
    - P_J289
    - P_J415
    - P_J302
    - P_J306
    - P_J307
    - P_J317
    - P_J14
    - P_J422
  # BATADAL is hourly. A 24 row window represents one day of context.
  window_size: 24
  stride: 1
  label_rule: any
  validation_fraction: 0.20

# A physical C-Town graph is not claimed here. This experiment uses the same
# documented fully connected statistical fallback as the secondary protocol.
topology: {}

model:
  detection_mode: normal_only
  d_model: 64
  n_heads: 4
  n_layers: 2
  dropout: 0.15
  score_top_k: 5

training:
  seed: 7
  epochs: 30
  batch_size: 64
  learning_rate: 0.0002
  weight_decay: 0.0001
  physics_weight: 0.0
  reconstruction_weight: 0.05
  root_weight: 0.0
  mask_probability: 0.15
  calibration_quantile: 0.995
  node_scale_quantile: 0.99
  lower_reference_probability: 0.05

physics_invariants: []

process_grounding:
  require: false
  invariant_threshold: 0.05
  counterfactual_minimum: 0.0

artifacts:
  directory: artifacts/batadal_v11/seeds

evaluation:
  protocol: "Dataset 3 normal only training and calibration; one untouched evaluation on labeled Dataset 4"
  artifact_slug: batadal_v11
  seeds: [7, 17, 29, 43, 61]
  baseline_seed: 7
  excluded_unlabeled_file: data/raw/batadal/BATADAL_test_dataset.csv
